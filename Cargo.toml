[package]
name = "delfin"
version = "0.1.0"
edition = "2021"
description = "A KDE Dolphin-style file manager for Windows, written in Rust"

[dependencies]
eframe = "0.29"
open = "5"
trash = "5"
dirs = "5"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
